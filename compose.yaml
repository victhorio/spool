services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spool
      POSTGRES_PASSWORD: local-spool-only
      POSTGRES_DB: spool
    ports:
      - "127.0.0.1::5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spool -d spool"]
      interval: 1s
      timeout: 3s
      retries: 30
    mem_limit: 1g
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://spool:local-spool-only@db:5432/spool
      BIND_ADDR: 0.0.0.0
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1::8080"
    init: true
    mem_limit: 512m
volumes:
  pgdata:
